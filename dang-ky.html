<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gia Nhập Cộng Đồng | VeloSport</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo">Velo<span>Sport</span></div>
            <nav>
                <ul>
                    <li><a href="index.html">Trang Chủ</a></li>
                    <li><a href="bong-da.html">Bóng Đá Việt</a></li>
                    <li><a href="tennis.html">Quần Vợt</a></li>
                    <li><a href="dang-ky.html" class="active">Gia Nhập</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>Tạo Tài Khoản VeloSport</h2>
                <p>Trở thành thành viên để nhận phân tích thể thao chuyên sâu hàng ngày.</p>
            </div>
            
            <form id="register-form">
                <div class="form-group">
                    <label class="input-label">Tên hiển thị</label>
                    <input type="text" class="form-control" placeholder="trinh" required>
                </div>

                <div class="form-group">
                    <label class="input-label">Địa chỉ Email</label>
                    <input type="email" class="form-control" placeholder="name@domain.com" required>
                </div>

                <div class="form-group">
                    <label class="input-label">Mật mã bảo mật</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-action-full">KÍCH HOẠT TÀI KHOẢN</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 velosport.com.vn. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
